name: Update Alpine.js docs

on:
  schedule:
    # Runs every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      alpine_ref:
        description: 'Alpine.js git ref to fetch docs from (branch, tag, or commit SHA)'
        required: false
        default: 'main'

concurrency:
  group: update-alpine-docs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate docs
        run: npm run generate
        env:
          ALPINE_REF: ${{ inputs.alpine_ref || 'main' }}

      - name: Validate generated docs and server
        run: npm test && npm run typecheck && npm run build

      - name: Open or update documentation pull request
        id: docs-pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: main
          branch: automation/update-alpine-docs
          add-paths: docs/
          delete-branch: true
          commit-message: 'chore: update Alpine.js docs from upstream'
          title: 'Update Alpine.js documentation snapshot'
          body: |
            Refresh the bundled documentation from the official Alpine.js repository.

            The source ref and resolved commit are recorded in `docs/.source.json`.
            This PR changes documentation only. It does not bump the package version,
            create a release, or publish to npm.

            The pull request is automatically squash-merged after the required
            `validate` check passes. A failed check leaves it open for investigation.

      - name: Enable auto-merge after validation
        if: steps.docs-pr.outputs.pull-request-operation == 'created' || steps.docs-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.docs-pr.outputs.pull-request-number }}
        run: gh pr merge --repo "$GITHUB_REPOSITORY" --squash --auto "$PR_NUMBER"
